<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Miami Live · Miami Magic</title>
<!--
  Visor de cámaras en vivo de Miami Magic.

  ¿Por qué existe esta página? Dentro de la app nativa el origen es
  capacitor://localhost, y YouTube rechaza ese origen con "Error 150 / 153".
  Al servir el reproductor desde www.miamimagicapp.com, el origen es un sitio
  real y YouTube lo acepta. La app abre esta página dentro de su propia hoja,
  así que el usuario nunca sale de Miami Magic.

  Uso:  /cam.html?v=ID_DE_YOUTUBE&t=Nombre%20de%20la%20camara&lang=es
-->
<style>
  :root{ --navy:#0E1B30; --navy2:#0B1526; --coral:#FF4D35; --cream:#FFF0E0; --teal:#00C9B1; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--navy),var(--navy2));}
  header{flex:0 0 auto;display:flex;align-items:center;gap:9px;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;color:var(--cream);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);
    box-shadow:0 0 0 0 rgba(255,77,53,.7);animation:p 1.8s infinite;}
  @keyframes p{70%{box-shadow:0 0 0 9px rgba(255,77,53,0)}100%{box-shadow:0 0 0 0 rgba(255,77,53,0)}}
  .live{font:800 .62rem/1 sans-serif;letter-spacing:.2em;color:var(--coral);}
  h1{margin:0;font:700 .95rem/1.2 sans-serif;color:var(--cream);
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #stage{flex:1 1 auto;position:relative;background:#000;}
  #stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  footer{flex:0 0 auto;padding:10px 16px calc(env(safe-area-inset-bottom) + 12px);
    color:rgba(255,240,224,.55);font:500 .7rem/1.5 sans-serif;text-align:center;}
  #err{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;padding:24px;text-align:center;color:var(--cream);}
  #err b{font:700 1rem/1.3 sans-serif;}
  #err span{font:500 .84rem/1.6 sans-serif;color:rgba(255,240,224,.7);max-width:300px;}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="dot"></span><span class="live">LIVE</span>
    <h1 id="title">Miami Live</h1>
  </header>
  <div id="stage">
    <div id="err">
      <b id="errT">La cámara no está disponible</b>
      <span id="errS">Su proveedor la tiene pausada en este momento. Vuelve a intentarlo más tarde.</span>
    </div>
  </div>
  <footer id="credit">Cámara en directo · cortesía de su proveedor oficial</footer>
</div>

<script>
(function(){
  var q = new URLSearchParams(location.search);
  var v = (q.get('v')||'').trim();
  var t = (q.get('t')||'').trim();
  var es = (q.get('lang')||'es').indexOf('es') === 0;

  if(t) document.getElementById('title').textContent = t;
  document.getElementById('credit').textContent = es
    ? 'Cámara en directo · cortesía de su proveedor oficial'
    : 'Live camera · courtesy of its official provider';
  document.getElementById('errT').textContent = es
    ? 'La cámara no está disponible' : 'This camera is unavailable';
  document.getElementById('errS').textContent = es
    ? 'Su proveedor la tiene pausada en este momento. Vuelve a intentarlo más tarde.'
    : 'Its provider has it paused right now. Please try again later.';

  var idOk = /^[A-Za-z0-9_-]{6,20}$/.test(v);
  if(!idOk){ document.getElementById('err').style.display='flex'; return; }

  var f = document.createElement('iframe');
  f.title = t || 'Live camera';
  f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
  f.setAttribute('allowfullscreen','');
  f.setAttribute('playsinline','');
  f.referrerPolicy = 'strict-origin-when-cross-origin';
  f.src = 'https://www.youtube.com/embed/' + v +
          '?autoplay=1&mute=1&playsinline=1&rel=0&modestbranding=1' +
          '&origin=' + encodeURIComponent(location.origin);
  document.getElementById('stage').appendChild(f);
})();
</script>
</body>
</html>
