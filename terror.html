<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Ruta del Terror · Miami Magic</title>
<meta name="description" content="El radar de Halloween de Miami: 15 paradas en cinco niveles de miedo, de las calabazas para niños a las casas embrujadas. Fechas, horarios y cómo llegar.">
<link rel="canonical" href="https://www.miamimagicapp.com/terror.html">
<meta property="og:title" content="La Ruta del Terror · Miami Magic">
<meta property="og:description" content="15 paradas en el mapa, cinco niveles de miedo. Sigue al fantasma por Miami hasta la noche del 31.">
<meta property="og:image" content="https://www.miamimagicapp.com/fotos/terror-og.jpg">
<meta property="og:url" content="https://www.miamimagicapp.com/terror.html">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#060c16">
<link rel="icon" href="/miami-magic-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=Playfair+Display:ital,wght@0,700;0,800;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060c16; --ink:#f6efe4; --mut:#a9b4c6; --line:rgba(255,255,255,.08);
  --gold:#FFD166; --coral:#FF4D35; --teal:#00C9B1;
  --l1:#FFC24A; --l2:#FF8A3D; --l3:#FF5A3C; --l4:#E8333A; --l5:#B3122E;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overscroll-behavior-x:none}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,sans-serif;line-height:1.5;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 700px at 85% -10%,rgba(255,77,53,.13),transparent 60%),radial-gradient(900px 600px at -10% 30%,rgba(120,80,255,.10),transparent 60%)}
a{color:inherit}
.wrap{position:relative;z-index:1;width:min(1080px,100%);margin:0 auto;padding:0 20px}
/* top bar */
.top{position:sticky;top:0;z-index:30;padding:calc(env(safe-area-inset-top) + 12px) 0 12px;background:rgba(6,12,22,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand svg{width:30px;height:30px}
.brand b{font-family:"Playfair Display",serif;font-weight:800;font-size:19px;letter-spacing:.01em}
.brand b span{color:var(--coral)}
.tbtns{display:flex;gap:8px}
.ib{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:var(--ink);height:38px;min-width:38px;padding:0 12px;border-radius:19px;font:700 13px "DM Sans",sans-serif;letter-spacing:.08em;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.ib svg{width:17px;height:17px}
/* hero */
.hero{padding:22px 0 0}
.kick{font-family:"Bebas Neue",sans-serif;letter-spacing:.24em;font-size:15px;color:var(--gold);display:flex;align-items:center;gap:10px}
.kick i{display:inline-block;width:26px;height:2px;background:var(--coral)}
h1{font-family:"Playfair Display",serif;font-weight:800;font-size:clamp(42px,11vw,88px);line-height:.94;margin:10px 0 10px;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:700;color:var(--coral);text-shadow:0 0 34px rgba(255,77,53,.45)}
.lede{font-size:16px;color:#e3dccf;max-width:620px}
.lede b{color:var(--gold);font-weight:800}
/* live strip */
.live{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-family:"Bebas Neue",sans-serif;letter-spacing:.12em;font-size:15.5px;color:var(--mut)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 0 rgba(255,77,53,.6);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,53,.55)}70%{box-shadow:0 0 0 12px rgba(255,77,53,0)}100%{box-shadow:0 0 0 0 rgba(255,77,53,0)}}
.live .g{color:var(--gold)}.live .lv1{white-space:nowrap;font-size:clamp(13px,3.7vw,15.5px);letter-spacing:.09em}
/* countdown */
.count{margin:12px 0 0;padding:18px 18px 16px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.015))}
.count .lab{font-family:"Bebas Neue",sans-serif;letter-spacing:.2em;font-size:14px;color:var(--mut)}
.cd{display:flex;gap:10px;margin-top:8px;align-items:flex-end;flex-wrap:wrap}
.cd{flex-wrap:nowrap}.cd div{min-width:0;flex:1}
.cd b{display:block;font-family:"Bebas Neue",sans-serif;font-size:clamp(34px,10vw,52px);line-height:1;color:var(--gold);text-shadow:0 0 24px rgba(255,209,102,.35);font-variant-numeric:tabular-nums}
.cd span{font-size:12px;color:var(--mut);letter-spacing:.12em;text-transform:uppercase}
.cd .sep{display:none}
.count .msg{margin-top:6px;font-size:15px;color:#e8e1d6}
/* radar */
.sect{padding:24px 0 6px}
.h2{font-family:"Playfair Display",serif;font-weight:800;font-size:clamp(28px,6vw,42px);line-height:1.05}
.h2 em{font-style:italic;color:var(--coral)}
.sub{color:var(--mut);margin-top:6px;font-size:15px;max-width:620px}
.radar{position:relative;margin-top:16px;border-radius:22px;overflow:hidden;border:1px solid rgba(0,201,177,.18);box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.03);aspect-ratio:1400/1553;background:#08111d;touch-action:pan-y}
.radar img.map{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.sweep{position:absolute;left:var(--cx);top:var(--cy);width:260%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;mix-blend-mode:screen;
  background:conic-gradient(from 0deg,rgba(0,201,177,0) 0deg,rgba(0,201,177,0) 318deg,rgba(0,201,177,.05) 345deg,rgba(0,255,220,.16) 359.4deg,rgba(0,201,177,0) 360deg);
  animation:spin 6s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.rings{position:absolute;left:var(--cx);top:var(--cy);transform:translate(-50%,-50%);pointer-events:none}
.rings i{position:absolute;left:50%;top:50%;border:1px solid rgba(0,201,177,.13);border-radius:50%;transform:translate(-50%,-50%)}
.mk{position:absolute;transform:translate(-50%,-62%);width:clamp(27px,5.8vw,44px);aspect-ratio:1;border:0;background:none;cursor:pointer;padding:0;transition:opacity .35s, filter .35s;-webkit-tap-highlight-color:transparent}
.mk img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6));animation:bob 3.4s ease-in-out infinite}
.mk::after{content:"";position:absolute;left:50%;top:86%;width:70%;height:18%;transform:translate(-50%,0);border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.75;filter:blur(1px)}
.mk .ping{position:absolute;left:50%;top:50%;width:150%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.4);border:2px solid var(--c);opacity:0;animation:ping 6s linear infinite;animation-delay:var(--dl)}
@keyframes ping{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}1%{opacity:.95}14%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}100%{opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.mk.off{opacity:.18;filter:grayscale(1)}
.mk.hide{opacity:0;pointer-events:none}
.mk.today .ping{animation-duration:2s;animation-delay:0s}
.ghost{position:absolute;width:clamp(44px,10vw,74px);transform:translate(-50%,-110%);pointer-events:none;z-index:5;transition:left 2.4s cubic-bezier(.45,.05,.3,1),top 2.4s cubic-bezier(.45,.05,.3,1);filter:drop-shadow(0 0 16px rgba(200,220,255,.55))}
.ghost img{width:100%;animation:float 2.6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
.ghost.sleep img{animation:none;opacity:.55}
.trail{position:absolute;inset:0;pointer-events:none;z-index:4}
.badge{position:absolute;right:12px;top:12px;z-index:6;font-family:"Bebas Neue";letter-spacing:.18em;font-size:13px;color:#bff7ee;background:rgba(0,0,0,.45);border:1px solid rgba(0,201,177,.35);padding:5px 10px;border-radius:20px;display:flex;gap:7px;align-items:center;backdrop-filter:blur(6px)}
.badge .dot{width:7px;height:7px;background:var(--teal);animation:pulse2 1.6s infinite}
@keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(0,201,177,.6)}70%{box-shadow:0 0 0 10px rgba(0,201,177,0)}100%{box-shadow:0 0 0 0 rgba(0,201,177,0)}}
.badge.live2{color:#ffd9d2;border-color:rgba(255,77,53,.5)} .badge.live2 .dot{background:var(--coral)}
/* tracker panel */
.track{margin-top:12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;padding:14px 16px;border-radius:16px;background:rgba(0,201,177,.06);border:1px solid rgba(0,201,177,.18)}
.track img{width:46px;grid-row:span 3}
.track .t1{font-family:"Bebas Neue";letter-spacing:.18em;font-size:13px;color:#7fe9da}
.track .t2{font-family:"Playfair Display",serif;font-weight:700;font-size:20px;line-height:1.2}
.track .t3{font-size:14px;color:var(--mut)} .track .t3 b{color:var(--gold)}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;appearance:none;-webkit-appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--ink);border-radius:22px;height:40px;padding:0 14px 0 8px;display:flex;align-items:center;gap:8px;font:700 13.5px "DM Sans",sans-serif;cursor:pointer}
.chip img{width:24px;height:24px;object-fit:contain}
.chip .n{font-family:"Bebas Neue";font-size:16px;color:var(--c)}
.chip.on{background:var(--c);color:#14080a;border-color:var(--c)} .chip.on .n{color:#14080a}
.chip.all{padding:0 16px}
/* level groups + cards */
.lv{margin-top:26px}
.lvh{display:flex;align-items:center;gap:12px}
.lvh img{width:42px;height:42px;object-fit:contain}
.lvh .k{font-family:"Bebas Neue";letter-spacing:.2em;font-size:14px;color:var(--c)}
.lvh h3{font-family:"Playfair Display",serif;font-weight:800;font-size:26px;line-height:1.05}
.lvh p{color:var(--mut);font-size:14.5px;font-style:italic;font-family:"Playfair Display",serif}
.meter{display:flex;gap:4px;margin-left:auto}
.meter i{width:7px;height:20px;border-radius:3px;background:rgba(255,255,255,.1)}
.meter i.f{background:var(--c);box-shadow:0 0 10px var(--c)}
.cards{display:grid;gap:10px;margin-top:12px;grid-template-columns:1fr}
@media(min-width:720px){.cards{grid-template-columns:1fr 1fr}}
.card{position:relative;text-align:left;appearance:none;-webkit-appearance:none;width:100%;border:1px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.015));color:var(--ink);border-radius:16px;padding:14px 14px 14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;cursor:pointer;font-family:inherit;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c)}
.card .nm{font-weight:800;font-size:17px;line-height:1.25}
.card .wh{font-family:"Bebas Neue";letter-spacing:.12em;font-size:15px;color:var(--gold)}
.card .vn{grid-column:1/-1;color:var(--mut);font-size:14px}
.st{align-self:start;font-family:"Bebas Neue";letter-spacing:.14em;font-size:12.5px;padding:3px 9px;border-radius:12px;white-space:nowrap}
.st.today{background:var(--coral);color:#fff}
.st.on{background:rgba(0,201,177,.16);color:#7fe9da;border:1px solid rgba(0,201,177,.35)}
.st.soon{background:rgba(255,209,102,.1);color:var(--gold);border:1px solid rgba(255,209,102,.3)}
.st.past{background:rgba(255,255,255,.06);color:#7d8796}
.card.past{opacity:.5}
/* night of the 31st */
.night{margin-top:12px;border-radius:20px;padding:20px 18px;background:linear-gradient(170deg,rgba(255,77,53,.12),rgba(120,60,200,.10) 60%,rgba(0,0,0,0));border:1px solid rgba(255,77,53,.22)}
.tl{list-style:none;margin-top:14px;position:relative}
.tl::before{content:"";position:absolute;left:70px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--l1),var(--l2),var(--coral),#8a2be2)}
.tl li{display:grid;grid-template-columns:58px 1fr;gap:18px;padding:9px 0;position:relative}
.tl li::after{content:"";position:absolute;left:65px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.tl li.now::after{background:var(--coral);border-color:var(--coral);box-shadow:0 0 0 6px rgba(255,77,53,.25)}
.tl .h{font-family:"Bebas Neue";font-size:19px;color:var(--gold);letter-spacing:.06em;text-align:right;line-height:1.3}
.tl b{display:block;font-size:16.5px}
.tl span{color:var(--mut);font-size:14px}
.tip{margin-top:14px;font-family:"Playfair Display",serif;font-style:italic;font-size:17px;color:#f1e6d7}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88vh;overflow:auto;background:#0c1626;border-top:1px solid rgba(255,255,255,.1);border-radius:24px 24px 0 0;padding:10px 22px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);box-shadow:0 -30px 60px rgba(0,0,0,.5)}
@media(min-width:720px){.sheet{left:50%;right:auto;width:600px;transform:translate(-50%,105%)}.open .sheet{transform:translate(-50%,0)!important}}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:translateY(0)}
.grab{width:42px;height:5px;border-radius:3px;background:rgba(255,255,255,.18);margin:4px auto 14px}
.sh-top{display:flex;gap:14px;align-items:center}
.sh-top img{width:58px;height:58px;object-fit:contain}
.sh-k{font-family:"Bebas Neue";letter-spacing:.2em;font-size:13.5px;color:var(--c)}
.sh-n{font-family:"Playfair Display",serif;font-weight:800;font-size:25px;line-height:1.1}
.xb{margin-left:auto;align-self:flex-start;appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.07);border:0;color:var(--ink);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center}
.xb svg{width:16px;height:16px}
.rows{margin-top:16px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:22px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;align-items:start}
.row svg{width:19px;height:19px;color:var(--gold);margin-top:2px}
.row .g{color:var(--gold);font-weight:700}
.desc{margin-top:14px;font-size:15.5px;color:#e6dfd3}
.ltip{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(0,201,177,.08);border:1px solid rgba(0,201,177,.22);font-size:14.5px}
.ltip b{color:#7fe9da;font-family:"Bebas Neue";letter-spacing:.16em;font-weight:400;font-size:13px;display:block}
.links{margin-top:10px}
.lk{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);text-decoration:none;font-size:15px;color:var(--ink);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:inherit;cursor:pointer}
.lk svg{width:19px;height:19px;color:var(--gold);flex:0 0 auto}
.lk span{color:var(--mut)} .lk .ar{margin-left:auto;color:var(--gold)}
/* footer */
.foot{margin:44px 0 0;padding:28px 0 calc(38px + env(safe-area-inset-bottom));border-top:1px solid var(--line);text-align:center}
.foot .p1{font-family:"Playfair Display",serif;font-size:22px;font-weight:700}
.foot .p1 em{color:var(--coral)}
.foot a.url{display:inline-block;margin-top:8px;font-family:"Bebas Neue";letter-spacing:.18em;font-size:22px;color:var(--coral);text-decoration:none}
.foot .p2{margin-top:4px;font-family:"Bebas Neue";letter-spacing:.16em;font-size:14px;color:var(--teal)}
.foot .fine{margin-top:16px;font-size:12.5px;color:#6f7b8d;max-width:520px;margin-left:auto;margin-right:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#fff;color:#111;padding:10px 16px;border-radius:20px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:900px){
  #radar{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);column-gap:28px;align-items:start}
  #radar .radar{grid-column:1;grid-row:1/span 5;margin-top:0}
  #radar>*:not(.radar){grid-column:2}
  #radar .sub{margin-top:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/" aria-label="Miami Magic">
    <svg viewBox="0 0 40 40" aria-hidden="true"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF4E35"/><stop offset="1" stop-color="#FFCF65"/></linearGradient></defs><rect width="40" height="40" rx="10" fill="url(#pg)"/><path d="M20 33V17" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><path d="M20 17c-3-4-8-5-11-3 4 0 7 1 11 3zm0 0c3-4 8-5 11-3-4 0-7 1-11 3zm0 0c-1-4-4-7-8-7 3 2 6 4 8 7zm0 0c1-4 4-7 8-7-3 2-6 4-8 7z" fill="#fff"/></svg>
    <b>Miami <span>Magic</span></b>
  </a>
  <div class="tbtns">
    <button class="ib" id="shareAll" aria-label="Compartir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button>
    <button class="ib" id="langBtn">EN</button>
  </div>
</div></header>

<main class="wrap">
  <section class="hero">
    <div class="kick"><i></i><span data-es="HALLOWEEN 2026 · MIAMI" data-en="HALLOWEEN 2026 · MIAMI"></span></div>
    <h1 data-es="La ruta<br><em>del Terror</em>" data-en="The Horror<br><em>Route</em>"></h1>
    <p class="lede" data-es="El radar de Halloween de Miami: <b>15</b> paradas en <b>5</b> niveles de miedo, de las calabazas a las casas embrujadas. Y un fantasma suelto que puedes seguir hasta la noche del <b>31</b>." data-en="Miami's Halloween radar: <b>15</b> stops across <b>5</b> levels of fear, from pumpkin patches to haunted houses. And a ghost on the loose you can follow to the night of the <b>31st</b>."></p>
    <div class="live"><span class="dot"></span><span class="lv1"><span id="liveClock"></span> <span id="liveCount"></span></span></div>
  </section>

  <section class="sect" id="radar" style="padding-top:14px">
    <div class="radar" id="map">
      <img class="map" src="/fotos/terror-mapa.jpg" alt="" draggable="false">
      <div class="rings" id="rings"></div>
      <div class="sweep"></div>

 nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 21 3l-8 18-2-8-8-2z"/></svg>',
 share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>',
 x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>'
};
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
function openStop(id){
  var o=DATA[id];if(!o)return;var L=lvOf(id),st=status(o);
  var addr=F(o,'venue');
  var maps='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr.replace(/·/g,',')+', Miami, FL');
  var h='<div class="grab"></div><div class="sh-top" style="--c:'+L.c+'"><img src="'+SPR[L.spr]+'" alt=""><div><div class="sh-k">'+T('NIVEL ','LEVEL ')+L.n+' · '+(lang==='es'?L.es:L.en).toUpperCase()+'</div><div class="sh-n">'+esc(F(o,'name'))+'</div></div><button class="xb" id="xb" aria-label="'+T('Cerrar','Close')+'">'+IC.x+'</button></div>';
  h+='<div class="rows">';
  h+='<div class="row">'+IC.cal+'<div><span class="g">'+esc(when(o))+'</span>'+(F(o,'time')?' · '+esc(F(o,'time')):'')+' <span class="st '+st.k+'" style="margin-left:6px">'+(lang==='es'?st.es:st.en)+'</span></div></div>';
  h+='<div class="row">'+IC.pin+'<div>'+esc(addr)+'</div></div>';
  var pr=F(o,'price'); if(pr&&!/^(ver enlace|see link)$/i.test(pr)) h+='<div class="row">'+IC.tag+'<div class="g">'+esc(pr)+'</div></div>';
  h+='</div>';
  if(F(o,'desc')) h+='<p class="desc">'+esc(F(o,'desc'))+'</p>';
  if(F(o,'tip')) h+='<div class="ltip"><b>'+T('DATO DE LOCAL','LOCAL TIP')+'</b>'+esc(F(o,'tip'))+'</div>';
  if(id==='wrooftop26') h+='<div class="ltip"><b>21+</b>'+T('Solo mayores de 21.','Over 21 only.')+'</div>';
  h+='<div class="links">';
  if(o.link&&!BLOGS.test(o.link)) h+='<a class="lk" href="'+esc(o.link)+'" target="_blank" rel="noopener">'+IC.web+T('Sitio web','Website')+' <span>· '+esc(host(o.link))+'</span><span class="ar">↗</span></a>';
  h+='<a class="lk" href="'+maps+'" target="_blank" rel="noopener">'+IC.nav+T('Cómo llegar','Directions')+' <span>· Google Maps</span><span class="ar">↗</span></a>';
  h+='<button class="lk" id="shStop">'+IC.share+T('Compartir esta parada','Share this stop')+'</button>';
  h+='</div>';
  $('sheet').innerHTML=h; $('sh').classList.add('open');
  $('xb').onclick=closeStop; $('shStop').onclick=function(){share(F(o,'name')+' · '+T('La Ruta del Terror','The Horror Route'),'#'+id)};
  try{history.replaceState(null,'','#'+id)}catch(e){}
}
function closeStop(){$('sh').classList.remove('open');try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
$('scrim').onclick=closeStop; document.addEventListener('keydown',function(e){if(e.key==='Escape')closeStop()});
function toast(t){var x=$('toast');x.textContent=t;x.classList.add('on');setTimeout(function(){x.classList.remove('on')},1800)}
function share(title,hash){
  var url=location.origin+location.pathname+(hash||'');
  if(navigator.share){navigator.share({title:title,url:url}).catch(function(){});return}
  try{navigator.clipboard.writeText(url).then(function(){toast(T('Enlace copiado','Link copied'))})}catch(e){toast(url)}
}
$('shareAll').onclick=function(){share(T('La Ruta del Terror · Miami Magic','The Horror Route · Miami Magic'),'')};

/* ---------- the ghost */
var NIGHT=[ // the 31st, Miami time
 {id:'cgtrick26',h:15,mi:0},{id:'lrhalloween26',h:17,mi:30},{id:'hallowyn26',h:20,mi:0},{id:'wrooftop26',h:22,mi:30}
];
var NIGHT_END=etDate('2026-11-01',2,0);
function stopXY(id){for(var i=0;i<STOPS.length;i++)if(STOPS[i][0]===id)return xy(STOPS[i][2],STOPS[i][3])}
function hash(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=n*0x27d4eb2d;n=n^(n>>>15);return n>>>0}
var lastG=null, sleeping=false;
function ghostState(){
  var t=now(),e=et(t),iso=e.iso;
  var night0=etDate('2026-10-31',NIGHT[0].h,NIGHT[0].mi);
  if(t>=night0&&t<NIGHT_END){
    var i=NIGHT.length-1; for(var k=0;k<NIGHT.length;k++){if(t>=etDate('2026-10-31',NIGHT[k].h,NIGHT[k].mi))i=k}
    var cur=NIGHT[i],nx=NIGHT[i+1];
    var since=(t-etDate('2026-10-31',cur.h,cur.mi))/6e4;
    var a=stopXY(i?NIGHT[i-1].id:cur.id),b=stopXY(cur.id),fly=Math.min(1,since/25);
    var p=i&&fly<1?{x:a.x+(b.x-a.x)*fly,y:a.y+(b.y-a.y)*fly}:b;
    var mins=nx?Math.max(0,Math.round((etDate('2026-10-31',nx.h,nx.mi)-t)/6e4)):Math.max(0,Math.round((NIGHT_END-t)/6e4));
    return {live:true,id:cur.id,p:p,flying:i&&fly<1,next:nx&&nx.id,mins:mins,idx:i};
  }
  if(iso>'2026-11-01'||(iso==='2026-11-01'&&e.h>=23)) return {asleep:true,id:'houseofhorror26',p:stopXY('houseofhorror26')};
  var pool=STOPS.filter(function(s){var st=status(DATA[s[0]]);return (st.k==='today'||st.k==='on')&&s!==EXTRA&&!(iso<'2026-11-01'&&s[0]==='wrooftop26')});
  if(iso==='2026-11-01') pool=STOPS.filter(function(s){return /horror|screams|horrorland/.test(s[0])});
  if(!pool.length) pool=STOPS.filter(function(s){return s!==EXTRA});
  var mins=e.h*60+e.mi, slot=Math.floor(mins/12), day=dayDiff(iso,'2026-10-01');
  var pick=pool[hash(day*131+slot)%pool.length];
  if(pool.length>1&&pick===pool[hash(day*131+slot-1)%pool.length]) pick=pool[(pool.indexOf(pick)+1)%pool.length];
  return {id:pick[0],p:stopXY(pick[0]),ago:mins%12,nextIn:12-mins%12};
}
function drawTrail(){
  var svg=$('trail'),pts=NIGHT.map(function(n){return stopXY(n.id)});
  svg.setAttribute('viewBox','0 0 100 100');
  var d='M'+pts.map(function(p){return p.x.toFixed(2)+' '+p.y.toFixed(2)}).join(' L');
  svg.innerHTML='<path d="'+d+'" fill="none" stroke="rgba(255,77,53,.75)" stroke-width=".55" stroke-dasharray="1.4 1.1" vector-effect="non-scaling-stroke" style="stroke-width:2px"/>';
}
function tickGhost(){
  var g=ghostState(),gh=$('ghost'),o=DATA[g.id]||{},nm=F(o,'name');
  gh.style.left=g.p.x+'%'; gh.style.top=g.p.y+'%'; gh.classList.toggle('sleep',!!g.asleep);
  var b=$('badge');b.classList.toggle('live2',!!g.live);
  if(g.live){
    $('badgeTxt').textContent=T('EN VIVO · NOCHE DEL 31','LIVE · HALLOWEEN NIGHT');
    $('trk1').textContent=g.flying?T('EL FANTASMA VUELA HACIA','THE GHOST IS FLYING TO'):T('EL FANTASMA ESTÁ EN','THE GHOST IS AT');
    $('trk2').textContent=nm;
    var nx=g.next?F(DATA[g.next],'name'):'';
    $('trk3').innerHTML=nx?T('Sigue a ','Next: ')+esc(nx)+T(' en <b>'+g.mins+'</b> min',' in <b>'+g.mins+'</b> min'):T('Última parada. Se despide en <b>'+g.mins+'</b> min.','Last stop. Gone in <b>'+g.mins+'</b> min.');
    $('trail').style.display='';
  } else if(g.asleep){
    $('badgeTxt').textContent=T('RADAR EN PAUSA','RADAR ASLEEP');
    $('trail').style.display='none';
    $('trk1').textContent=T('EL FANTASMA DUERME','THE GHOST IS ASLEEP'); $('trk2').textContent=T('Vuelve en octubre de 2027','Back in October 2027'); $('trk3').textContent=T('Gracias por recorrer Miami con nosotros.','Thanks for haunting Miami with us.');
  } else {
    $('badgeTxt').textContent=T('RADAR ACTIVO','RADAR ON');
    $('trk1').textContent=T('ÚLTIMO AVISTAMIENTO','LAST SIGHTING'); $('trk2').textContent=nm;
    $('trk3').innerHTML=(g.ago?T('Hace <b>'+g.ago+'</b> min','<b>'+g.ago+'</b> min ago'):T('Ahora mismo','Right now'))+' · '+T('próximo salto en <b>'+g.nextIn+'</b> min','next jump in <b>'+g.nextIn+'</b> min');
    $('trail').style.display='none';
  }
  if(lastG!==g.id){ if(MK[g.id]){var m=MK[g.id];m.classList.add('today');} lastG=g.id; }
}
/* ---------- clock, count and countdown */
var START=etDate('2026-10-31',17,0);
function pad(n){return String(n).padStart(2,'0')}
function tick(){
  var t=now(),e=et(t);
  var h12=((e.h+11)%12)+1, ap=e.h<12?'AM':'PM';
  $('liveClock').innerHTML='MIAMI · <span class="g">'+h12+':'+pad(e.mi)+'</span> '+ap;
  var open=STOPS.filter(function(s){var k=status(DATA[s[0]]).k;return k==='today'||k==='on'}).length;
  $('liveCount').innerHTML='· <span class="g">'+open+'</span> '+T(open===1?'PARADA ABIERTA HOY':'PARADAS ABIERTAS HOY',open===1?'STOP OPEN TODAY':'STOPS OPEN TODAY');
  var d=START-t;
  if(d>0){
    var D=Math.floor(d/864e5),H=Math.floor(d/36e5)%24,M=Math.floor(d/6e4)%60,S=Math.floor(d/1e3)%60;
    $('cdLab').textContent=T('LA NOCHE DEL 31 EMPIEZA EN','HALLOWEEN NIGHT STARTS IN');
    $('cd').innerHTML='<div><b>'+D+'</b><span>'+T('días','days')+'</span></div><div><b>'+pad(H)+'</b><span>'+T('horas','hours')+'</span></div><div class="sep">:</div><div><b>'+pad(M)+'</b><span>min</span></div><div class="sep">:</div><div><b>'+pad(S)+'</b><span>seg</span></div>';
    $('cdMsg').textContent=T('Ese día el fantasma hace el recorrido completo, en vivo, aquí.','That day the ghost runs the full route, live, right here.');
  } else if(t<NIGHT_END){
    $('cdLab').textContent=T('ES ESTA NOCHE','IT IS TONIGHT'); $('cd').innerHTML='<div><b>31</b><span>'+T('octubre','october')+'</span></div>';
    $('cdMsg').textContent=T('El fantasma ya salió. Síguelo en el radar.','The ghost is out. Follow it on the radar.');
  } else {
    $('cdLab').textContent=T('HALLOWEEN 2026','HALLOWEEN 2026'); $('cd').innerHTML='';
    $('cdMsg').textContent=e.iso<='2026-11-01'?T('Último día de los scream parks: hoy cierran House of Horror, The Horrorland y Sounds of Screams.','Last day of the scream parks: House of Horror, The Horrorland and Sounds of Screams close today.'):T('La ruta vuelve en octubre de 2027.','The route returns in October 2027.');
  }
}
function renderNight(){
  var t=now(),h='';
  var labels={cgtrick26:T('Trick-or-treat de niños','Kids trick-or-treat'),lrhalloween26:T('Niños de 5 a 7, luego el desfile','Kids 5–7, then the parade'),hallowyn26:T('La fiesta gratis de Wynwood','Wynwood\'s free block party'),wrooftop26:T('Para cerrar, solo mayores de 21','To close the night, 21+ only')};
  var times=['3:00 PM','5:30 PM','8:00 PM','10:30 PM'];
  NIGHT.forEach(function(n,i){
    var a=etDate('2026-10-31',n.h,n.mi),b=NIGHT[i+1]?etDate('2026-10-31',NIGHT[i+1].h,NIGHT[i+1].mi):NIGHT_END;
    h+='<li class="'+(t>=a&&t<b?'now':'')+'"><div class="h">'+times[i].replace(' ','<br>')+'</div><div><b>'+esc(F(DATA[n.id],'name'))+'</b><span>'+labels[n.id]+' · '+esc(F(DATA[n.id],'venue'))+'</span></div></li>';
  });
  $('tl').innerHTML=h;
}
/* ---------- language */
function applyLang(){
  document.documentElement.lang=lang; $('langBtn').textContent=lang==='es'?'EN':'ES';
  [].forEach.call(document.querySelectorAll('[data-es]'),function(el){el.innerHTML=el.getAttribute('data-'+lang)});
  renderChips(); renderLevels(); applyFilter(); renderNight(); tick(); tickGhost();
}
$('langBtn').onclick=function(){lang=lang==='es'?'en':'es';try{localStorage.setItem('mm_lang',lang)}catch(e){}applyLang()};

/* ---------- live data from the events calendar (same file the app reads) */
function merge(j){
  try{['semana','mes'].forEach(function(k){(j[k]||[]).forEach(function(it){if(DATA[it.id])Object.keys(it).forEach(function(f){if(it[f]!==''&&it[f]!=null)DATA[it.id][f]=it[f]})})});
      (j.quitar_semana||[]).forEach(function(id){if(DATA[id])DATA[id].d2=DATA[id].d='2000-01-01'})}catch(e){}
}
drawTrail(); applyLang();
setInterval(tick,1000); setInterval(tickGhost,15000); setInterval(renderNight,60000);
fetch('/eventos.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j){merge(j);applyLang()}}).catch(function(){});
if(location.hash.length>1){var id=location.hash.slice(1);if(DATA[id])setTimeout(function(){openStop(id)},400)}
})();
</script>
