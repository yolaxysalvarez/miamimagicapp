<style>
:root{--bg:#FFFDF9;--paper:#FFF8EF;--card:#FFF2E2;--ink:#0E1B30;--ink2:#2B3A52;--mut:#4A5568;--line:rgba(14,27,48,.10);--coral:#FF4D35;--coral-d:#C93A25;--gold:#C9963C;--teal:#12806E;--keys:#10563C;
--pf:'Playfair Display',Georgia,serif;--bb:'Bebas Neue',Impact,sans-serif;--dm:'DM Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--dm);font-size:17px;line-height:1.5}
a{color:var(--coral-d);text-decoration:none}
a:hover{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;text-decoration-color:rgba(201,150,60,.85)}
img{display:block;max-width:100%}
.gfx{margin:26px 0 30px}.gfx img{width:100%;height:auto;border-radius:14px;border:1px solid #E8E1D6}.gfx figcaption{font-size:13px;color:#5A6577;margin-top:8px;line-height:1.4}

button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--coral);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 40px}
.col{max-width:720px;margin:0 auto}
/* encabezado */
.hdr{position:sticky;top:0;z-index:20;background:rgba(255,253,249,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hdr:after{content:"";display:block;height:2px;background:linear-gradient(90deg,#FF4D35 0%,#FFB347 40%,rgba(201,150,60,.22) 100%)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-top:14px;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand img{width:40px;height:40px;border-radius:11px;box-shadow:0 6px 12px -8px rgba(201,58,37,.65)}
.brand b{font-family:var(--pf);font-weight:900;font-size:27px;letter-spacing:-.01em;white-space:nowrap}
.brand .news{display:inline-flex;padding:5px 9px 3px;border-radius:7px;background:linear-gradient(135deg,#FF6A4D,#FF4D35);color:#fff;font-family:var(--bb);font-size:19px;letter-spacing:.18em;line-height:1;transform:rotate(-3deg)}
.lng{display:flex;gap:2px;border:1px solid rgba(14,27,48,.2);border-radius:999px;padding:3px;background:#fff}
.lng button{border:0;background:none;padding:6px 13px;border-radius:999px;font-weight:700;font-size:15px;color:var(--ink)}
.lng button.on{background:linear-gradient(135deg,#D9442D,#C93A25);color:#fff;box-shadow:0 3px 8px -4px rgba(201,58,37,.7)}
.bar{height:3px;background:linear-gradient(90deg,#FF4D35,#FFB347);width:0;transition:width .1s linear}
/* nota */
article{padding:44px 0 20px}
.crumb{font-family:var(--bb);font-size:19px;letter-spacing:.16em;color:var(--mut)}
.crumb a{color:var(--ink);text-decoration:underline;text-decoration-color:rgba(201,150,60,.7);text-decoration-thickness:1.5px;text-underline-offset:4px}
.dev{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin:14px 0 -4px}.dev span{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 3px;border-radius:999px;background:var(--coral);color:#fff;font-family:var(--bb);font-size:17px;letter-spacing:.14em;line-height:1.3}.dev span i{width:8px;height:8px;border-radius:50%;background:#fff;animation:devp 1.4s ease-in-out infinite}.dev em{font-style:normal;font-size:14.5px;color:var(--mut)}
@keyframes devp{0%,100%{opacity:1}50%{opacity:.35}}
.upd{display:flex;align-items:center;gap:9px;margin:26px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:14.5px;color:var(--mut)}.upd i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--coral);animation:devp 1.4s ease-in-out infinite}
.crumb .sc{color:var(--coral-d)}.crumb .sc.ky{color:var(--keys)}
.ccw{font-family:var(--pf);font-weight:900;color:var(--ink);white-space:nowrap;letter-spacing:0;text-transform:none}.ccw .em{display:inline-block;width:.74em;height:.74em;margin:0 .16em;vertical-align:-.1em}.crumb .ccw{font-size:20px}
.dkw{font-family:var(--pf);font-weight:900;color:var(--ink);white-space:nowrap;letter-spacing:0;text-transform:none}.dkw em{font-weight:700;color:#0B5C7A}
.pil{display:inline-block;width:.13em;height:.74em;margin:0 .03em;border-radius:.05em .05em .02em .02em;vertical-align:-.02em;background:linear-gradient(180deg,transparent 0 16%,#E4CC97 16% 25%,transparent 25% 100%),linear-gradient(90deg,#6A4A2D 0%,#B08856 48%,#76532F 100%)}
.ringw{display:inline-block;filter:drop-shadow(0 0 .025em rgba(11,92,122,.85));vertical-align:-.02em;margin:0 .015em}
.ring{display:block;width:.5em;height:.5em;border-radius:50%;background:conic-gradient(#FF4D35 0 45deg,#fff 0 90deg,#FF4D35 0 135deg,#fff 0 180deg,#FF4D35 0 225deg,#fff 0 270deg,#FF4D35 0 315deg,#fff 0 360deg);-webkit-mask:radial-gradient(circle,transparent 44%,#000 47%);mask:radial-gradient(circle,transparent 44%,#000 47%)}
.sol{display:inline-block;width:.54em;height:.54em;margin:0 .012em;border-radius:50%;vertical-align:-.02em;background:linear-gradient(180deg,#FFC24D 0%,#FF8A3D 55%,#FF4D35 100%)}
.hmw{font-family:var(--pf);font-weight:900;letter-spacing:0;text-transform:none;color:var(--ink);white-space:nowrap}.hmw em{font-weight:700;color:var(--coral-d)}
.crumb .hmw{font-size:20px}
h1{font-family:var(--pf);font-weight:900;font-size:52px;line-height:1.06;letter-spacing:-.01em;margin:16px 0 14px}
.bajada{font-family:var(--pf);font-style:italic;font-weight:700;font-size:23px;line-height:1.35;color:var(--ink2)}
.by{display:flex;align-items:center;gap:14px;margin:26px 0 28px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.av{flex:none;object-fit:cover;box-shadow:0 0 0 2px #fff,0 0 0 3.5px #FF8A3D;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#FFC24D,#FF4D35);color:#fff;font-family:var(--dm);font-weight:700;font-size:21px;display:flex;align-items:center;justify-content:center}
.by b{display:block;font-size:16px;line-height:1.3}
.by span{font-size:14px;line-height:1.45;color:var(--mut)}
@media(max-width:640px){.by{gap:12px;margin:18px 0 22px;padding:12px 0}.by .av{width:40px;height:40px}.by b{font-size:15px}.by span{font-size:13.5px}}
.hero{position:relative;border-radius:12px;overflow:hidden;margin:0 auto 10px;max-width:1000px;background:#EADFCF;aspect-ratio:16/9}
.hero img{width:100%;height:100%;object-fit:cover}
.hero.tall{max-width:460px}
.wm{position:absolute;right:14px;bottom:12px;font-family:var(--bb);font-size:14px;line-height:1;letter-spacing:.1em;color:#fff;opacity:.92;text-shadow:0 1px 3px rgba(0,0,0,.55);border-left:3px solid var(--coral);padding-left:6px}
@media(max-width:640px){.wm{right:10px;bottom:9px;font-size:11.5px;border-left-width:2px;padding-left:5px}}
.cap{max-width:1000px;margin:0 auto 34px;font-size:15px;color:var(--mut)}
.body p{font-size:20px;line-height:1.65;margin-bottom:22px;color:#18253B}
.b1 p:first-child:first-letter{float:left;font-family:var(--pf);font-weight:900;font-size:76px;line-height:.86;padding:6px 10px 0 0;color:var(--coral-d)}
.nm{color:var(--coral-d);font-weight:700}
.lk{color:var(--coral-d);font-weight:700;text-decoration:underline;text-decoration-color:rgba(201,150,60,.7);text-decoration-thickness:1.5px;text-underline-offset:3px}
.toca{margin:34px 0;padding:24px 26px;border-radius:12px;background:#FFF4DC;border:1px solid #E9BE78}
.body h3.q{font-family:var(--pf);font-weight:700;font-size:22px;line-height:1.2;color:var(--ink);margin:28px 0 8px;padding-left:12px;border-left:3px solid var(--coral)}
.toca>b{display:block;font-family:var(--bb);font-weight:400;font-size:20px;letter-spacing:.18em;color:#8A5A12;margin-bottom:10px}
.toca li{list-style:none;display:flex;gap:14px;font-size:19px;line-height:1.45;margin-bottom:10px}
.toca li i{flex:none;font-style:normal;font-family:var(--pf);font-weight:900;color:var(--coral-d)}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:30px 0 8px}
.gal figure:first-child{grid-column:1/-1}
.gal .gi{position:relative;display:block;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#EADFCF}
.gal figure:first-child .gi{aspect-ratio:16/9}
.gal img{width:100%;height:100%;object-fit:cover}
.gal figcaption{font-size:14px;color:var(--mut);margin-top:6px}
.src{margin:36px 0 26px;padding-top:18px;border-top:2px solid var(--ink)}
.src h5,.op h5,.rel h5{font-family:var(--bb);font-weight:400;font-size:20px;letter-spacing:.16em;margin-bottom:12px}
.src li{list-style:none;font-size:17px;margin-bottom:8px;padding-left:16px;position:relative}
.src li:before{content:"";position:absolute;left:0;top:10px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.upd{font-size:15px;color:var(--mut);margin-bottom:24px}
.share{position:relative;display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:40px;padding-top:22px;border-top:1px solid var(--line)}
.sbtn{display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 22px 0 18px;border-radius:12px;font-weight:700;font-size:16px;letter-spacing:.01em;transition:transform .15s,box-shadow .2s,border-color .2s}
.sbtn svg{flex:none}
.sbtn.pri{border:0;color:#fff;background:linear-gradient(135deg,#D9442D,#C93A25);box-shadow:0 10px 20px -12px rgba(201,58,37,.9),inset 0 1px 0 rgba(255,255,255,.25)}
.sbtn.sec{border:1px solid rgba(201,150,60,.55);color:var(--ink);background:#fff;box-shadow:0 6px 14px -12px rgba(14,27,48,.6)}
.sbtn:hover{transform:translateY(-1px)}.sbtn.sec:hover{border-color:var(--gold)}
.smenu{position:absolute;left:0;top:calc(100% + 8px);z-index:30;min-width:260px;padding:8px;border-radius:14px;background:#fff;border:1px solid rgba(201,150,60,.35);box-shadow:0 26px 44px -26px rgba(14,27,48,.6);animation:smin .18s ease-out}
@keyframes smin{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.smenu a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--ink);font-weight:700;font-size:16px}
.smenu a:hover{background:var(--paper);text-decoration:none}
.smenu a i{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--paper);border:1px solid rgba(201,150,60,.35)}
.op{padding:28px;border-radius:12px;background:var(--paper);border:1px solid rgba(201,150,60,.3);margin-bottom:28px}
.op h5{font-family:var(--pf);font-weight:700;font-size:28px;letter-spacing:0;margin-bottom:16px}
.op .list{margin-bottom:18px}
.op .c{padding:14px 0;border-bottom:1px solid var(--line)}
.op .c b{font-size:16px}.op .c span{font-size:14px;color:var(--mut);margin-left:8px}
.op .c p{font-size:17px;margin-top:4px}
.op form{display:flex;flex-direction:column;gap:12px}
.op .row{display:flex;gap:12px}
.op input,.op textarea{width:100%;border-radius:10px;border:1px solid rgba(14,27,48,.22);padding:14px 16px;font:500 17px var(--dm);background:#fff;color:var(--ink)}
.op textarea{min-height:110px;resize:vertical}
.op button{align-self:flex-start;height:50px;padding:0 26px;border-radius:10px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:17px}
.op small{font-size:14px;color:var(--mut)}
.op .ok{display:none;font-family:var(--pf);font-weight:700;font-size:19px}
.rel{margin-bottom:28px}
.rel a.app{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 22px;border-radius:12px;background:#fff;border:1px solid rgba(14,27,48,.08);box-shadow:0 9px 17px -14px rgba(14,27,48,.55);color:var(--ink);font-family:var(--pf);font-weight:700;font-size:20px;position:relative;overflow:hidden}
.rel a.app:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--coral)}
.rel a.app em{font-style:normal;font-family:var(--bb);font-size:17px;letter-spacing:.14em;color:var(--coral-d)}
/* sigue leyendo */
.mas{margin:6px 0 34px}
.mas .mg{margin-bottom:26px}
.mas h5{font-family:var(--bb);font-weight:400;font-size:20px;letter-spacing:.16em;display:flex;align-items:center;gap:10px;margin-bottom:4px;padding-top:16px;border-top:2px solid var(--ink)}
.mas h5 .ccw{font-size:19px}
.mas a.mi{display:grid;grid-template-columns:112px minmax(0,1fr);gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.mas a.mi:hover{text-decoration:none}.mas a.mi:hover b{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px;text-decoration-color:rgba(201,150,60,.85)}
.mas .th{width:112px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--card)}
.mas .th img{width:100%;height:100%;object-fit:cover}
.mas .th.fit img{object-fit:contain;background:#0E1B30}
.mas .eb{display:block;font-family:var(--bb);font-size:15px;letter-spacing:.12em;color:var(--coral-d);margin-bottom:3px}
.mas .eb.ky{color:var(--keys)}
.mas b{display:block;font-family:var(--pf);font-weight:700;font-size:18px;line-height:1.25}
.mas a.ev{display:grid;grid-template-columns:62px minmax(0,1fr);gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.mas a.ev:hover{text-decoration:none}.mas a.ev:hover b{text-decoration:underline;text-underline-offset:4px;text-decoration-color:rgba(201,150,60,.85)}
.mas .dt{text-align:center;border:1px solid rgba(14,27,48,.14);border-radius:8px;padding:6px 2px;background:#fff}
.mas .dt i{display:block;font-style:normal;font-family:var(--bb);font-size:14px;letter-spacing:.1em;color:var(--coral-d)}
.mas .dt u{display:block;text-decoration:none;font-family:var(--pf);font-weight:700;font-size:22px;line-height:1.05;color:var(--gold)}
.mas .dt s{display:block;text-decoration:none;font-family:var(--bb);font-size:14px;letter-spacing:.1em;color:var(--mut)}
.mas .ev p{font-size:15px;color:var(--mut);margin-top:2px}
.mas a.go{display:inline-block;margin-top:14px;font-family:var(--bb);font-size:17px;letter-spacing:.14em;color:var(--coral-d)}
@media(max-width:640px){.mas a.mi{grid-template-columns:96px minmax(0,1fr);gap:12px}.mas .th{width:96px}.mas b{font-size:17px}}
.nl{border-radius:12px;padding:28px;margin-bottom:44px;background:linear-gradient(140deg,#FFF6EC,#FFEBDC 60%,#FFE3D3);display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
.nl b{font-family:var(--pf);font-weight:700;font-size:26px}.nl b em{color:var(--coral-d)}
.nl form{display:flex;gap:10px;flex:1 1 320px;max-width:420px}
.nl input{flex:1;height:50px;border-radius:10px;border:1px solid rgba(14,27,48,.22);padding:0 16px;font:500 17px var(--dm)}
.nl button{height:50px;padding:0 20px;border-radius:10px;border:0;background:linear-gradient(135deg,#D9442D,#C93A25);color:#fff;font-weight:700}
.nl p{flex-basis:100%;font-size:15px;color:var(--mut)}
.nf{padding:120px 0;text-align:center}
.nf b{display:block;font-family:var(--pf);font-weight:900;font-size:40px;margin-bottom:10px}
footer{border-top:1px solid rgba(201,150,60,.35);background:#fff;padding:22px 0 34px;font-size:15px;color:var(--mut)}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
@media (max-width:760px){
  .wrap{padding:0 18px}
  .brand b{font-size:22px}.brand .news{font-size:14px;padding:4px 7px 2px}.brand{gap:9px}.brand img{width:34px;height:34px;border-radius:9px}
  article{padding-top:28px}
  h1{font-size:34px}.bajada{font-size:20px}
  .body p{font-size:18px}.b1 p:first-child:first-letter{font-size:62px}
  .hero{border-radius:0;margin:0 -18px 10px}
  .hero.tall{border-radius:12px;margin:0 auto 10px;width:62%}
  .op{padding:20px}.op .row{flex-direction:column}
  .nl form{flex-direction:column;max-width:none}
}
.fsoc{display:inline-flex;gap:10px;align-items:center}.fsoc a{width:36px;height:36px;border-radius:50%;border:1px solid rgba(14,27,48,.2);display:grid;place-items:center;background:#fff}
.toca li i,.btc b,.btc td:first-child{font-family:var(--dm);font-weight:700;font-variant-numeric:tabular-nums}
.btc{margin:14px 0 26px}.btc-h{font-size:17px;color:var(--ink2);margin:0 0 10px}.btc-h b{color:var(--coral-d);font-size:21px}.btc-h span{color:var(--mut);font-size:15px}
.btc table{width:100%;border-collapse:collapse;border-top:3px solid var(--gold)}.btc th{font-family:var(--bb);font-weight:400;font-size:15px;letter-spacing:.16em;color:var(--mut);text-align:left;padding:11px 4px 9px;border-bottom:1px solid var(--line)}
.btc td{padding:12px 4px;border-bottom:1px solid var(--line);font-size:18px;color:var(--ink)}.btc td:first-child{color:var(--ink)}.btc td b{color:#A9781F;font-size:20px}.btc th:last-child,.btc td:last-child{text-align:right}
.btc-n{font-size:14.5px;color:var(--mut);margin:10px 0 0;line-height:1.45}
.hmw em,.hm-pill b em{color:#E8391F}.dkw em{color:#0E7FA8}
</style>

<body>
<header class="hdr">
  <div class="wrap">
    <a class="brand" href="/noticias" id="home"><img src="/miami-magic-icon-192.png" alt=""><b>Miami Magic</b><span class="news">NEWS</span></a>
    <span class="lng"><button data-l="es">ES</button><button data-l="en">EN</button></span>
  </div>
