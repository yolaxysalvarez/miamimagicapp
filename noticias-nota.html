img{display:block;max-width:100%}

.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand:hover{text-decoration:none}
.brand img{width:40px;height:40px;border-radius:11px;box-shadow:0 6px 12px -8px rgba(201,58,37,.65)}

  .hero{border-radius:0;margin:0 -18px 10px}
  .op{padding:20px}.op .row{flex-direction:column}
  .nl form{flex-direction:column;max-width:none}
}
</style>

    fetch(SB+'mm_news_subs',{method:'POST',headers:Object.assign({'Content-Type':'application/json',Prefer:'return=minimal'},H),body:JSON.stringify({email:em.toLowerCase().slice(0,160),lang:L,origen:ID})})
     .then(function(r){if(!r.ok&&r.status!==409)throw 0;ok.textContent=t('nlOk');document.getElementById('nlF').style.display='none'}).catch(function(){ok.textContent=t('opErr')})};
}
function loadOps(){
  if(DEMO)return;
  fetch(SB+'mm_opiniones?select=name,texto,created_at&approved=eq.true&nota=eq.'+encodeURIComponent(ID)+'&order=created_at.desc&limit=50',{headers:H}).then(function(r){return r.ok?r.json():[]}).then(function(a){
    var l=document.getElementById('opL');if(!l||!a.length)return;
    l.innerHTML=a.map(function(c){return '<div class="c"><b>'+esc(c.name)+'</b><span>'+fd(c.created_at)+'</span><p>'+esc(c.texto)+'</p></div>'}).join('')}).catch(function(){});
}
function setLang(l){L=l;try{localStorage.setItem('mm_lang',l)}catch(e){}var u=new URL(location.href);if(l==='en')u.searchParams.set('lang','en');else u.searchParams.delete('lang');history.replaceState(null,'',u);render()}
document.querySelectorAll('.lng button').forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
addEventListener('scroll',function(){var a=document.querySelector('article');if(!a)return;var h=a.offsetHeight-innerHeight,p=h>0?Math.min(1,Math.max(0,scrollY/h)):0;document.getElementById('bar').style.width=(p*100)+'%'},{passive:true});
document.getElementById('yr').textContent=new Date().getFullYear();
fetch(DEMO?'/noticias-ejemplo.json':'/noticias.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){N=(j.notas||[]).filter(function(n){return n.id===ID})[0]||null;render()}).catch(function(){render()});
})();
</script>
</body>
